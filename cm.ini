[custom]
;--- Mihomo 基础模板 ---
; 持久化 fake-ip 映射，避免 OpenClash/Mihomo 重启后浏览器缓存旧 198.18.x.x 引发证书串号
clash_rule_base=https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/all_base.tpl

;Y-clash v3.2 终极配置 (含 ACL4SSR 规则集)
;订阅转换器: https://dy.369163.xyz
;配置引用: https://raw.githubusercontent.com/tdsq369/Y-clash/main/cm.ini
;AI 维护 | 规则见 rules/ 目录

;--- 核心性能 ---
udp=true
tcp_concurrent=true
unified_delay=true

;--- GEO ---
geodata_mode=true
geo_auto_update=true
geo_update_interval=720

;--- DNS ---
default_dns=223.5.5.5, 119.29.29.29, 114.114.114.114
dns_server=https://dns.alidns.com/dns-query, https://doh.pub/dns-query
dns_rule=quic://dns.alicdn.com, https://dns.alidns.com/dns-query, []GEOSITE,cn,apple,steam,category-games@cn,private

; ============================================================================
; 规则区
; 优先级: 局域网/解禁 > 广告拦截 > 直连 > 分类代理 > 兜底
; ============================================================================

;--- 局域网 / 解禁 (ACL4SSR) ---
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/direct.list,86400

;--- 广告拦截 (Loyalsoldier + ACL4SSR) ---
ruleset=🛑 全球拦截,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt,86400
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/block.list,86400

;--- 中国直连 (GEOSITE + ACL4SSR) ---
ruleset=🎯 全球直连,[]GEOSITE,apple-cn
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

;--- 私有 / Cloudflare 直连 ---
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,[]GEOIP,cloudflare,no-resolve

;--- PT/BT 端口放行 ---
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,86400

;--- Telegram (GEOSITE + ACL4SSR) ---
ruleset=💬 社交通讯,[]GEOSITE,telegram
ruleset=💬 社交通讯,[]GEOIP,telegram,no-resolve
ruleset=💬 社交通讯,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

;--- AI 服务 ---
ruleset=🤖 AI服务,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn

;--- 流媒体 ---
ruleset=🎬 流媒体,[]GEOSITE,netflix
ruleset=🎬 流媒体,[]GEOSITE,disney
ruleset=🎬 流媒体,[]GEOSITE,spotify
ruleset=🎬 流媒体,[]GEOSITE,tiktok
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

;--- 社交通讯 ---
ruleset=💬 社交通讯,[]GEOSITE,category-communication
ruleset=💬 社交通讯,[]GEOSITE,category-social-media-!cn

;--- 开发工具 ---
ruleset=🛠️ 开发工具,[]GEOSITE,github
ruleset=🛠️ 开发工具,[]GEOSITE,docker

;--- 游戏 ---
ruleset=🎮 游戏,[]GEOSITE,steam
ruleset=🎮 游戏,[]GEOSITE,gfw

;--- 通用代理 (GEOSITE + ACL4SSR ProxyLite) ---
ruleset=🚀 节点选择,[]GEOSITE,google
ruleset=🚀 节点选择,[]GEOSITE,youtube
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/proxy.list,86400

;--- Cloudflare CDN ---
ruleset=☁️ CloudFlareCDN,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CloudflareCIDR.list

;--- 兜底 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ============================================================================
; 策略组
; ============================================================================

;--- 主选择组 ---
custom_proxy_group=🚀 节点选择`select`[]🤖 AI服务`[]🎬 流媒体`[]💬 社交通讯`[]🛠️ 开发工具`[]🎮 游戏`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]DIRECT`.*

;--- 分类子组 (只引用工具组，不引用节点选择，避免循环) ---
custom_proxy_group=🤖 AI服务`select`[]♻️ 自动选择`[]🔯 故障转移`.*
custom_proxy_group=🎬 流媒体`select`[]♻️ 自动选择`[]🔯 故障转移`.*
custom_proxy_group=💬 社交通讯`select`[]♻️ 自动选择`[]🔯 故障转移`.*
custom_proxy_group=🛠️ 开发工具`select`[]♻️ 自动选择`[]🔯 故障转移`.*
custom_proxy_group=🎮 游戏`select`[]♻️ 自动选择`[]🔯 故障转移`.*

;--- 工具组 ---
custom_proxy_group=♻️ 自动选择`url-test`.*`https://www.gstatic.com/generate_204`2160,,50
custom_proxy_group=🔯 故障转移`fallback`.*`https://www.gstatic.com/generate_204`300,,
custom_proxy_group=🔮 负载均衡`load-balance`.*`https://www.gstatic.com/generate_204`300,,

;--- 辅助组 ---
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]🤖 AI服务`[]🎬 流媒体`[]💬 社交通讯`[]🛠️ 开发工具`[]🎮 游戏
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*

enable_rule_generator=true
overwrite_original_rules=true
