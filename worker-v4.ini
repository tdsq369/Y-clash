[custom]
; ============================================================================
; Y-clash worker-v2  ——  clash-* 显式 behavior 版
; ============================================================================
; 与 worker.ini 并存，不替换。切换只改订阅 URL 里的 config 路径，随时可切回。
;
; 拼接方式:
;   https://sub.369163.xyz/sub?target=clash
;     &config=https://raw.githubusercontent.com/tdsq369/Y-clash/main/worker-v2.ini
;     &url=<你的机场订阅>
;
; 后端要求: SubConverter-Extended >= v1.9.13
;   v1.9.13 源码已确认支持 clash-domain: / clash-ipcidr: / clash-classic:
;   (src/handler/settings.cpp:172-174, src/generator/template/templates.cpp:893-904)
;
; format 自动判定（同源码）:
;   .mrs        -> format: mrs        二进制，最小最快
;   .txt        -> format: text       纯域名，每行一个
;   .yaml/.yml  -> format: yaml       payload 格式
;   其它扩展名  -> 不写 format        mihomo 默认按 yaml 解析 => 规则集会加载为空
;   ==> 所以本文件引用的规则集一律用 .txt / .mrs，绝不用 .list
;
; 相对 worker.ini 的变更（2026-10-29 实测依据）:
;   1. 移除 ACL4SSR BanEasyPrivacy / BanEasyList
;      实测 708 次拦截中 441 次来自 BanEasyPrivacy、198 次 BanEasyList，
;      目标是国内电信 CDN（IPv6 [240e:*] 与 IPv4 180.163.x/123.182.x），属误杀 + 重试风暴。
;   2. 拦截层改用「自维护 adblock.txt（ACL4SSR BanAD+BanProgramAD 转 text，1552 条）」+
;      category-ads-all.mrs；不再直接引 ACL4SSR 的 .list（只有 .list 混合格式，用 clash-*: 引会加载为空）。
;      Loyalsoldier reject.txt 也弃用：它的内容其实是 YAML payload，但 .txt 扩展名被转换器判成
;      format=text，19 万条规则全部失效（实测 4/6 拦截域名漏拦），见实测记录。
;   3. ACL4SSR ChinaDomain/ChinaCompanyIp 换成内联 GEOSITE,cn + GEOIP,CN,no-resolve
;      现网 ChinaDomain 命中 1619 次、GeoIP(cn) 1223 次，是最热的两条，用内联可省掉整份远程规则集。
;   4. GoogleCN / SteamCN 换成 GEOSITE,google@cn / apple@cn / microsoft@cn / steam@cn / category-games@cn
;      实测这五个分类在 MetaCubeX meta 分支均为 HTTP 200。
;   5. 自维护规则集从 .list 改为 .txt（rulesets/ 目录），走 clash-domain: 精确声明 domain behavior，
;      不再产生 X (Domain) + X (IP-CIDR) 双份 provider。
;   6. 补上是 worker.ini 缺的 AI / GitHub / 流媒体独立分流（现网 www.youtube.com 109 次都落在节点选择）。
;
; 保留: 9 个策略组名与现网运行配置完全一致，切回来不会出现策略引用错位。
; ============================================================================

clash_rule_base=https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/all_base.tpl

; ---------------------------------------------------------------------------
; 0. 内网 / 本机
; ---------------------------------------------------------------------------
ruleset=🎯 全球直连,[]GEOSITE,private
; GEOIP,private 已删除：mihomo 的 private 段包含 198.18.0.0/15（fake-ip 保留段），
; 会把所有 fake-ip 目标误送进「全球直连」导致连接超时。内网流量由 OpenClash 自身 LAN 规则处理。

; ---------------------------------------------------------------------------
; 1. 自维护直连（人工修过的域名优先级最高）
; ---------------------------------------------------------------------------
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/direct.txt,86400

; ---------------------------------------------------------------------------
; 2. 拦截（裁剪版：只留纯域名主力库）
; ---------------------------------------------------------------------------
; 自维护广告域名：ACL4SSR BanAD + BanProgramAD 转 text（1552 条，format=text 已实测有效）
; 只含精确广告/追踪域名，不含 BanEasyList / BanEasyPrivacy 两个国内 CDN 误杀源
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/adblock.txt,86400
; MetaCubeX 广告分类：8KB MRS，补 App 内置广告域名
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/category-ads-all.mrs,86400
; ACL4SSR 广告 keyword（domain 类规则集装不下 keyword，只能内联）
; ACL4SSR 广告 keyword：25 条 DOMAIN-KEYWORD 打包进 classical 规则集（内联超过 64 条 ruleset 行会被转换器拒绝，实测 65 行即 HTTP 400）
ruleset=🛑 全球拦截,clash-classic:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/adblock-keyword.txt,86400
; 自维护拦截
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/block.txt,86400

; ---------------------------------------------------------------------------
; 3. 国内有节点的服务，优先直连（替代 ACL4SSR GoogleCN / SteamCN）
; ---------------------------------------------------------------------------
ruleset=🎯 全球直连,[]GEOSITE,google@cn
ruleset=🎯 全球直连,[]GEOSITE,apple@cn
ruleset=🎯 全球直连,[]GEOSITE,microsoft@cn
ruleset=🎯 全球直连,[]GEOSITE,steam@cn
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn

; ---------------------------------------------------------------------------
; 4. 社交 / 即时通讯
; ---------------------------------------------------------------------------
ruleset=💬 社交媒体,[]GEOSITE,category-social-media-!cn
ruleset=💬 社交媒体,[]GEOSITE,telegram
ruleset=💬 社交媒体,[]GEOIP,telegram,no-resolve
ruleset=💬 社交媒体,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/social-chat.txt,86400
; keyword 规则不能进 domain provider，只能内联
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,facebook
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,messenger
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,instagram
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,twitter
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,whatsapp
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,discord
ruleset=💬 社交媒体,[]DOMAIN-KEYWORD,signal

; ---------------------------------------------------------------------------
; 5. AI 服务
; ---------------------------------------------------------------------------
ruleset=🚀 节点选择,[]GEOSITE,category-ai-!cn
ruleset=🚀 节点选择,[]GEOSITE,openai

; ---------------------------------------------------------------------------
; 6. 代码托管
; ---------------------------------------------------------------------------
ruleset=🚀 节点选择,[]GEOSITE,github

; ---------------------------------------------------------------------------
; 7. 流媒体
; ---------------------------------------------------------------------------
ruleset=🚀 节点选择,[]GEOSITE,youtube
ruleset=🚀 节点选择,[]GEOSITE,netflix
ruleset=🚀 节点选择,[]GEOSITE,disney
ruleset=🚀 节点选择,[]GEOSITE,hbo
ruleset=🚀 节点选择,[]GEOSITE,primevideo
ruleset=🚀 节点选择,[]GEOSITE,bahamut
ruleset=🚀 节点选择,[]GEOSITE,tiktok
ruleset=🚀 节点选择,[]GEOSITE,spotify
ruleset=🚀 节点选择,[]GEOSITE,apple-tvplus

; ---------------------------------------------------------------------------
; 8. 自维护代理
; ---------------------------------------------------------------------------
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/proxy.txt,86400
ruleset=🚀 节点选择,[]DOMAIN-KEYWORD,cloudfront
ruleset=🚀 节点选择,[]DOMAIN-KEYWORD,googlevideo
ruleset=🚀 节点选择,[]DOMAIN-KEYWORD,dl-a10b-
ruleset=🚀 节点选择,[]DOMAIN-KEYWORD,dl-z01a-

; ---------------------------------------------------------------------------
; 9. 被墙域名兜底（gfw 分类由 Loyalsoldier 从 gfwlist 生成，MetaCubeX 亦有）
; ---------------------------------------------------------------------------
ruleset=🚀 节点选择,[]GEOSITE,gfw

; ---------------------------------------------------------------------------
; 10. 国内兜底直连
; ---------------------------------------------------------------------------
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve

; ---------------------------------------------------------------------------
; 11. 兜底
; ---------------------------------------------------------------------------
ruleset=🐟 漏网之鱼,[]FINAL

; ===========================================================================
; 策略组（9 组，名称与现网运行配置一致）
; v1.9.13 注意: custom_proxy_group 里每组只用一个正则（>=v1.10.3 才支持多正则按序拼接）
; ===========================================================================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://zl.369529.xyz/204`1800,,9
custom_proxy_group=🔯 故障转移`fallback`.*`https://zl.369529.xyz/204`1800
custom_proxy_group=🔮 负载均衡`load-balance`.*`https://zl.369529.xyz/204`1800
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*
custom_proxy_group=💬 社交媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]🐟 漏网之鱼`.*
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*

enable_rule_generator=true
overwrite_original_rules=true
