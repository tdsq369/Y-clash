; ============================================================================
; 灰度版：仅 go-dyq 使用
;   2026-11-22 v2：策略组健康检查地址 https://zl.369529.xyz/204 -> http://www.gstatic.com/generate_204
;   2026-11-23 v3：按 70/100 评分补四类缺口（见下）
;   范围：只给 dyq.gcvasool.com（garm go-dyq）引用；验证一段时间无问题后再推广到 worker-tuned.ini
;   回滚：git revert 本文件对应提交，或 go-dyq config 换回 subconverter-ext/worker-tuned.ini
; ============================================================================
; v3 变更（每一项都对应 2026-11-23 验收扣分项）：
;   1) GEOIP,CN 补 no-resolve；Snap 集由 classical 改 clash-domain（内容本就是纯域名）
;   2) 新增 GEOSITE 兜底 geosite:cn（OpenClash 大陆白名单收录不全，单靠 GEOIP,CN 会漏）
;   3) 新增游戏下载/国内游戏/BT tracker 直连（category-game-platforms-download 等）
;   4) 新增 🤖 AI服务 独立组（openai / category-ai-!cn），排在各代理泛集之前
;   5) 新增 🔀 非标端口 组：80/443 以外端口默认直连，BT/PT 不再吃代理链路
;   6) 🎯 全球直连 只留 DIRECT，去掉误点即变代理的隐患
;   7) 自有规则集 interval 86400 -> 3600（自维护的直连/拦截集要跟手）
; 已知未解（需服务端改动，非本模板能解决）：
;   组 url 与 subconverter 生成的 provider health-check url 不同串，mihomo 会对同一节点
;   注册两份探测，且 provider 的 interval(300s) 覆盖组 interval(60s) —— 详见
;   skill router-openclash-fast-maintenance references/template-scorecard.md
; ============================================================================
[custom]
;--- Mihomo 基础模板 ---
; 持久化 fake-ip 映射，避免 OpenClash/Mihomo 重启后浏览器缓存旧 198.18.x.x 引发证书串号
clash_rule_base=https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/all_base.tpl

; ---- 私有地址/局域网（geosite 比 list 便宜，且先于一切 DNS 判定）----
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve

; ---- 自有域名强制直连（订阅站/转换后端走代理会看不到真实 IP）----
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,369529.xyz
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,369163.xyz
; 注意：369696.xyz 与 dyq.gcvasool.com 都直指 garm(141.148.181.108) 的 443，
; 家宽直连该端口 i/o timeout（实测 mihomo 日志 dial tcp 141.148.181.108:443），
; 必须保持「不显式匹配」→ 落到 DST-PORT,443 → 🐟 漏网之鱼 → 走代理才通。不要加直连规则。

; ---- 影视仓播放域名分流（2026-11-21 实测：本地直连 vs garm 代理）----
; 放在拦截/泛规则之前：实测集里有多条被 ACL4SSR 广告规则集覆盖的播放 CDN，被 REJECT 会直接黑屏。
; proxy 97 条 = 代理更快(77) + 仅代理可通(20)；direct 152 条 = 直连更快(151) + 仅直连通(1)。
; 文件名用 .txt：subconverter 按扩展名推断 rule-provider 的 format（.txt → format: text），
; 用 .list 会生成 behavior: domain 但不带 format，mihomo 按 yaml 解析纯域名清单会失败。
ruleset=📺 影视仓,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/m3u8-proxy.txt,21600
ruleset=📺 影视仓,[]IP-CIDR,185.34.144.117/32,no-resolve
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rulesets/m3u8-direct.txt,21600

; ---- 基础直连 / 自定义直连（自有集 1h 一更，外部集默认 24h）----
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/direct.list?v=20261121c,3600

; ---- 去广告 / 隐私追踪拦截（精确集，先拦；泛集下移到大陆兜底之后）----
ruleset=🛑 全球拦截,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt,86400
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyListChina.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
; block.list 是 Clash 规则语法（DOMAIN-SUFFIX,x），必须走普通前缀让 subconverter 转成
; getruleset → YamlRule provider；套 clash-domain: 会生成 behavior domain 但不带 format，
; mihomo 按 yaml 解析 Clash 语法会得到 0 条（2026-11-21 实测，与路由器侧同一个坑）。
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/block.list?v=20261121b,3600

; ---- 国内直连 ----
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; ---- 游戏下载 / 国内游戏 / BT tracker 直连（v3 新增）----
; category-game-platforms-download 只覆盖下载与更新，不影响登录/商店/联机
ruleset=🎯 全球直连,[]GEOSITE,category-games@cn
ruleset=🎯 全球直连,[]GEOSITE,category-game-platforms-download
ruleset=🎯 全球直连,[]GEOSITE,category-public-tracker

; ---- 社交媒体（独立组，便于单独选节点）----
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Facebook.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Whatsapp.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Instagram.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Discord.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Twitter.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/TikTok.list
ruleset=💬 社交媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Line.list
; Snap 清单内容本身是纯 DOMAIN-SUFFIX，改用 clash-domain 让它生成 behavior: domain
; （原来走普通前缀被推断成 classical，对纯域名规则集没有意义，还会让 IP 规则缺 no-resolve）
ruleset=💬 社交媒体,clash-domain:https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Snap/Snap.yaml,86400

; ---- AI 服务（v3 新增：专组，务必排在代理泛集之前，否则被 ProxyMedia/ProxyLite 抢走）----
ruleset=🤖 AI服务,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn

; ---- 其余代理 ----
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/proxy.list,3600
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=☁️ CloudFlareCDN,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CloudflareCIDR.list

; ---- 大陆兜底：域名（geosite）与 IP（geoip）双保险，no-resolve 防止为匹配 IP 额外解析 ----
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve

; ---- 泛广告/追踪集下移（v4，2026-11-23 实测依据）----
; 现网 22 条 REJECT 里 21 条来自 BanEasyPrivacy，目标全是国内电信 IP
; （sniffHost: hub-nj.sginput.qq.com、lbs.map.qq.com 等腾讯业务域），属误杀。
; 放到 geosite:cn / geoip:CN 之后：国内流量已被直连接住，这两集只作用于境外目标，
; 既保住境外广告拦截，又不再反复 REJECT 国内 CDN。要彻底激进可在面板把 🛑 全球拦截 切 DIRECT 对比。
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyList.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyPrivacy.list

; ---- 非标端口（80/443 之外）默认直连：BT/PT 与游戏对战不再吃代理链路 ----
; 组默认选中 🎯 全球直连；需要把非标端口拉回代理时，在面板把该组切到 🐟 漏网之鱼
ruleset=🔀 非标端口,[]DST-PORT,1-79
ruleset=🔀 非标端口,[]DST-PORT,81-442
ruleset=🔀 非标端口,[]DST-PORT,444-65535

ruleset=🐟 漏网之鱼,[]FINAL

; ---- 策略组（12 组）----
; 自动选择候选集 = 全部 Garm-*（出口都是 garm 那台机）；直连|更新(arm) 与 美眉妹(bwg) 不进自动择优
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`^Garm-`http://www.gstatic.com/generate_204`60,,20
custom_proxy_group=🔯 故障转移`fallback`^Garm-`http://www.gstatic.com/generate_204`120
custom_proxy_group=🔮 负载均衡`load-balance`^Garm-`http://www.gstatic.com/generate_204`120
custom_proxy_group=💬 社交媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*
; 直连组只留 DIRECT：避免误点导致「直连」变代理（原先把 🚀 节点选择/♻️ 自动选择 放在里面）
custom_proxy_group=🎯 全球直连`select`[]DIRECT
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*
custom_proxy_group=📺 影视仓`select`[]🚀 节点选择`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]🎯 全球直连
custom_proxy_group=🔀 非标端口`select`[]🎯 全球直连`[]🐟 漏网之鱼

enable_rule_generator=true
overwrite_original_rules=true
