[custom]
;--- Mihomo 基础模板 ---
; 持久化 fake-ip 映射，避免 OpenClash/Mihomo 重启后浏览器缓存旧 198.18.x.x 引发证书串号
clash_rule_base=https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/all_base.tpl

; Y-clash × SubConverter-Extended 优化配置 v2
; 配置引用: https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/Simple_Clash.ini
; 优化: 降低ping频率，避免CF CDN超时

ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,[]GEOIP,cloudflare,no-resolve
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/direct.list,21600

ruleset=🛑 全球拦截,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt,86400
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/block.list,21600

ruleset=🎯 全球直连,[]GEOSITE,apple-cn
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,86400

ruleset=🚀 节点选择,[]GEOSITE,telegram
ruleset=🚀 节点选择,[]GEOIP,telegram,no-resolve
ruleset=🚀 节点选择,[]GEOSITE,openai
ruleset=🚀 节点选择,[]GEOSITE,category-ai-!cn
ruleset=🚀 节点选择,[]GEOSITE,netflix
ruleset=🚀 节点选择,[]GEOSITE,disney
ruleset=🚀 节点选择,[]GEOSITE,spotify
ruleset=🚀 节点选择,[]GEOSITE,tiktok
ruleset=🚀 节点选择,[]GEOSITE,youtube
ruleset=🚀 节点选择,[]GEOSITE,category-emby
ruleset=🚀 节点选择,[]GEOSITE,category-communication
ruleset=🚀 节点选择,[]GEOSITE,category-social-media-!cn
ruleset=🚀 节点选择,[]GEOSITE,github
ruleset=🚀 节点选择,[]GEOSITE,docker
ruleset=🚀 节点选择,[]GEOSITE,steam
ruleset=🚀 节点选择,[]GEOSITE,category-games
ruleset=🚀 节点选择,[]GEOSITE,gfw
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/proxy.list,21600
ruleset=🐟 漏网之鱼,[]FINAL

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`https://zl.369529.xyz/204`3600,,50
custom_proxy_group=🔯 故障转移`fallback`.*`https://zl.369529.xyz/204`3600
custom_proxy_group=🔮 负载均衡`load-balance`.*`https://zl.369529.xyz/204`3600
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*

enable_rule_generator=true
overwrite_original_rules=true
