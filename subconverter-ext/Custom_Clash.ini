[custom]
;--- Mihomo 基础模板 ---
; 持久化 fake-ip 映射，避免 OpenClash/Mihomo 重启后浏览器缓存旧 198.18.x.x 引发证书串号
clash_rule_base=https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/all_base.tpl

; ============================================================================
; Y-clash × SubConverter-Extended 专属配置
; 基于用户实际使用场景优化：快分流、好路由、高速度
; 订阅转换器: https://sub.369163.xyz (SubConverter-Extended v1.1.18)
; 配置引用: https://raw.githubusercontent.com/tdsq369/Y-clash/main/subconverter-ext/Custom_Clash.ini
; AI 维护 | 规则见 rules/ 目录
; ============================================================================

; ============================================================================
; 规则区
; 优先级: 局域网/解禁 > 广告拦截 > 直连 > 分类代理 > 兜底
; ============================================================================

;--- 局域网 / 私有网络 ---
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]GEOIP,private,no-resolve
ruleset=🎯 全球直连,[]GEOIP,cloudflare,no-resolve

;--- 用户自定义直连 (局域网服务/高校BT/国内站点) ---
ruleset=🎯 全球直连,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/direct.list,21600

;--- 广告拦截 ---
ruleset=🛑 全球拦截,clash-domain:https://testingcf.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt,86400
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/block.list,21600

;--- 中国直连 (GEOSITE 兜底) ---
ruleset=🎯 全球直连,[]GEOSITE,apple-cn
ruleset=🎯 全球直连,[]GEOSITE,google-cn
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOIP,cn,no-resolve

;--- PT/BT 端口放行 (非标端口直连) ---
ruleset=🎯 全球直连,clash-classic:https://testingcf.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Port_Direct.yaml,86400

;--- Telegram ---
ruleset=💬 即时通讯,[]GEOSITE,telegram
ruleset=💬 即时通讯,[]GEOIP,telegram,no-resolve

;--- AI 服务 ---
ruleset=🤖 AI服务,[]GEOSITE,openai
ruleset=🤖 AI服务,[]GEOSITE,category-ai-!cn

;--- 流媒体 ---
ruleset=🎬 流媒体,[]GEOSITE,netflix
ruleset=🎬 流媒体,[]GEOSITE,disney
ruleset=🎬 流媒体,[]GEOSITE,spotify
ruleset=🎬 流媒体,[]GEOSITE,tiktok
ruleset=🎬 流媒体,[]GEOSITE,youtube
ruleset=🎬 流媒体,[]GEOSITE,category-emby

;--- 社交通讯 ---
ruleset=🌐 社交媒体,[]GEOSITE,category-communication
ruleset=🌐 社交媒体,[]GEOSITE,category-social-media-!cn

;--- 开发工具 ---
ruleset=🛠️ 开发工具,[]GEOSITE,github
ruleset=🛠️ 开发工具,[]GEOSITE,docker

;--- 游戏 ---
ruleset=🎮 游戏,[]GEOSITE,steam
ruleset=🎮 游戏,[]GEOSITE,category-games
ruleset=🎮 游戏,[]GEOSITE,gfw

;--- 苹果 / 微软 / 谷歌 (可选直连或代理) ---
ruleset=🍎 苹果服务,[]GEOSITE,apple
ruleset=Ⓜ️ 微软服务,[]GEOSITE,microsoft
ruleset=🇬 谷歌服务,[]GEOSITE,google

;--- 测速工具 ---
ruleset=🚀 测速工具,[]GEOSITE,category-speedtest

;--- 用户自定义代理 (BT/PT/VRChat/通用代理站) ---
ruleset=🚀 节点选择,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/proxy.list,21600

;--- 用户自定义屏蔽 ---
ruleset=🛑 全球拦截,clash-domain:https://raw.githubusercontent.com/tdsq369/Y-clash/main/rules/block.list,21600

;--- 兜底: 漏网之鱼走代理 ---
ruleset=🐟 漏网之鱼,[]FINAL

; ============================================================================
; 策略组
; 设计原则: 子组只引用工具组(自动/故障)，不引用父组(节点选择)，避免循环
; 速度优化: interval=2160s(36分钟), tolerance=30ms (避免 CF 拉黑)
; ============================================================================

;--- 主选择组 ---
custom_proxy_group=🚀 节点选择`select`[]🤖 AI服务`[]🎬 流媒体`[]💬 即时通讯`[]🌐 社交媒体`[]🛠️ 开发工具`[]🎮 游戏`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`[]DIRECT`.*`

;--- 分类子组 (只引用工具组，不引用节点选择，避免循环) ---
custom_proxy_group=🤖 AI服务`select`[]♻️ 自动选择`[]🔯 故障转移`.*`
custom_proxy_group=🎬 流媒体`select`[]♻️ 自动选择`[]🔯 故障转移`.*`
custom_proxy_group=💬 即时通讯`select`[]♻️ 自动选择`[]🔯 故障转移`[]🎯 全球直连`.*`
custom_proxy_group=🌐 社交媒体`select`[]♻️ 自动选择`[]🔯 故障转移`[]🎯 全球直连`.*`
custom_proxy_group=🛠️ 开发工具`select`[]♻️ 自动选择`[]🔯 故障转移`[]🎯 全球直连`.*`
custom_proxy_group=🎮 游戏`select`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`.*`

;--- 苹果/微软/谷歌 (默认直连，可手动切代理) ---
custom_proxy_group=🍎 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`.*`
custom_proxy_group=Ⓜ️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`.*`
custom_proxy_group=🇬 谷歌服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`.*`
custom_proxy_group=🚀 测速工具`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 自动选择`.*`

;--- 工具组 (interval=2160s/36min, tolerance=30ms) ---
custom_proxy_group=♻️ 自动选择`url-test`.*`https://cp.cloudflare.com/generate_204`2160,,30
custom_proxy_group=🔯 故障转移`fallback`.*`https://cp.cloudflare.com/generate_204`120,,
custom_proxy_group=🔮 负载均衡`load-balance`.*`https://cp.cloudflare.com/generate_204`120,,


custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]♻️ 自动选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]🤖 AI服务`[]🎬 流媒体`[]💬 即时通讯`[]🌐 社交媒体`[]🛠️ 开发工具`[]🎮 游戏
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`[]♻️ 自动选择`[]🔯 故障转移`[]🔮 负载均衡`.*`

enable_rule_generator=true
overwrite_original_rules=true
